<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CodeClass IDE</title>
<style>
:root{--b:#2ba8e0;--g:#35c978;--tx:#273444;--bg:#fff;--pn:#eff4f8;--ln:#d9e0e8}
@media(prefers-color-scheme:dark){:root{--tx:#e8eef5;--bg:#121a24;--pn:#1b2633;--ln:#2d3b4c}}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln)}
.logo{font-weight:800;font-size:20px;color:var(--b)}.logo b{color:var(--tx)}.sp{flex:1}
select,button{font:inherit;font-weight:700;padding:8px 14px;border-radius:99px;border:2px solid var(--b);background:var(--bg);color:var(--tx)}
button{background:var(--g);border-color:var(--g);color:#fff;cursor:pointer}button:disabled{opacity:.6}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:14px;border:0;outline:0;resize:none;background:var(--bg);color:var(--tx);padding:14px;tab-size:4}
#code{flex:3;min-height:0;white-space:pre;overflow:auto}
.lbl{font-size:12px;font-weight:700;padding:6px 14px;background:var(--pn);color:var(--b);border-top:1px solid var(--ln)}
#in{height:50px;background:var(--pn)}
#out{flex:2;min-height:0;margin:0;overflow:auto;padding:14px;background:var(--pn);font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap}
.err{color:#ef6351}
</style></head><body>
<header>
  <span class="logo">CODE<b>CLASS</b></span><span class="sp"></span>
  <select id="lang"></select><button id="run">▶ Run</button>
</header>
<textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
<div class="lbl">INPUT (stdin)</div><textarea id="in" spellcheck="false" placeholder="Optional input for your program"></textarea>
<div class="lbl">OUTPUT</div><pre id="out">Press Run (or Ctrl+Enter).</pre>
<script>
// ⚠ This key is visible to anyone who opens the page. Fine for testing; see notes before sharing publicly.
const API_KEY  = "880b8a213ac2888e7fac0e799472e75a";
const API_BASE = "https://api.onlinecompiler.io";
const FALLBACK = ["python-3.14","gcc-15","g++-15","openjdk-25"]; // used only if the compilers list can't load

const STARTERS = {
  python:'name = input("Your name: ")\nprint("Hello,", name)\n',
  gcc:'#include <stdio.h>\n\nint main(void) {\n    printf("Hello, World!\\n");\n    return 0;\n}\n',
  "g++":'#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello, World!" << endl;\n    return 0;\n}\n',
  openjdk:'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello, World!");\n    }\n}\n',
  default:'// Write your code here\n'
};
const $ = id => document.getElementById(id);
const family = c => (c.match(/^[a-z+#]+/i)||["default"])[0].toLowerCase();
const starter = c => STARTERS[family(c)] || STARTERS.default;
const headers = {"Authorization":API_KEY,"Content-Type":"application/json"};

function setCompilers(list){
  const saved = localStorage.getItem("cc_compiler");
  $("lang").innerHTML = list.map(c=>`<option>${c}</option>`).join("");
  if (saved && list.includes(saved)) $("lang").value = saved;
  loadCode();
}
function loadCode(){
  const k = "cc_code_"+$("lang").value;
  $("code").value = localStorage.getItem(k) ?? starter($("lang").value);
  localStorage.setItem("cc_compiler",$("lang").value);
}
$("lang").onchange = loadCode;
$("code").oninput = () => localStorage.setItem("cc_code_"+$("lang").value,$("code").value);
$("code").onkeydown = e => {
  if (e.key==="Tab"){ e.preventDefault(); const t=e.target,s=t.selectionStart; t.setRangeText("    ",s,t.selectionEnd,"end"); t.oninput(); }
  if (e.key==="Enter" && (e.ctrlKey||e.metaKey)){ e.preventDefault(); run(); }
};

async function loadCompilers(){
  try{
    const r = await fetch(API_BASE+"/api/compilers/",{headers});
    const d = await r.json();
    const arr = Array.isArray(d)?d:(d.compilers||d.results||[]);
    const ids = arr.map(x=>typeof x==="string"?x:(x.id||x.name||x.compiler)).filter(Boolean);
    setCompilers(ids.length?ids:FALLBACK);
  }catch(e){ setCompilers(FALLBACK); }
}

async function run(){
  const btn=$("run"), out=$("out"); btn.disabled=true; out.className=""; out.textContent="Running…";
  try{
    const r = await fetch(API_BASE+"/api/run-code-sync/",{method:"POST",headers,
      body:JSON.stringify({compiler:$("lang").value,code:$("code").value,input:$("in").value})});
    const d = await r.json().catch(()=>({error:"Bad response ("+r.status+")"}));
    const so = d.stdout ?? d.output ?? "";
    const se = [d.stderr, d.compile_output, d.error, d.detail].filter(Boolean).join("\n");
    if (!r.ok || se){ out.className="err"; out.textContent=(so?so+"\n":"")+(se||JSON.stringify(d,null,2)); }
    else out.textContent = so || (Object.keys(d).length?JSON.stringify(d,null,2):"(no output)");
  }catch(e){
    out.className="err";
    out.textContent="Couldn't reach the compiler API: "+e.message+"\n\nIf this says 'Failed to fetch', the browser is blocking the request (CORS) — see notes.";
  }
  btn.disabled=false;
}
$("run").onclick = run;
loadCompilers();
</script></body></html>
